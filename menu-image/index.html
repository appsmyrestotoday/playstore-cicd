<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu Image Gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #0f0f13;
      color: #e4e4e7;
      min-height: 100vh;
    }

    /* ── Header ─────────────────────────────────── */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(16px);
      background: rgba(15, 15, 19, 0.85);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #a78bfa, #818cf8, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
    }

    .header .count {
      font-size: 0.85rem;
      color: #71717a;
      font-weight: 500;
    }

    .search-box {
      position: relative;
      width: 300px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 16px 10px 40px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
      color: #e4e4e7;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-box input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    .search-box svg {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: #71717a;
    }

    /* ── Grid ───────────────────────────────────── */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      padding: 28px 32px 60px;
    }

    /* ── Card ───────────────────────────────────── */
    .card {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background: #18181b;
      border: 1px solid rgba(255, 255, 255, 0.06);
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }

    .card:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 12px 32px rgba(99, 102, 241, 0.18);
      border-color: rgba(99, 102, 241, 0.35);
    }

    .card .img-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #27272a;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.35s ease;
    }

    .card:hover img {
      transform: scale(1.08);
    }

    /* Copy overlay */
    .card .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.55);
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }

    .card:hover .overlay {
      opacity: 1;
    }

    .overlay svg {
      width: 28px;
      height: 28px;
      color: #a78bfa;
    }

    .overlay span {
      font-size: 0.75rem;
      font-weight: 600;
      color: #e4e4e7;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    /* Label */
    .card .label {
      padding: 10px 12px;
      font-size: 0.78rem;
      font-weight: 500;
      color: #a1a1aa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }

    /* ── Toast ──────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: linear-gradient(135deg, #6366f1, #818cf8);
      color: #fff;
      padding: 12px 24px;
      border-radius: 14px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 8px 30px rgba(99, 102, 241, 0.35);
      z-index: 9999;
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
      pointer-events: none;
      max-width: 90vw;
      text-align: center;
      word-break: break-all;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── No Results ─────────────────────────────── */
    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      color: #52525b;
      font-size: 1rem;
      display: none;
    }

    /* ── Loading ────────────────────────────────── */
    .loading {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      color: #71717a;
      font-size: 1rem;
    }

    .loading .spinner {
      display: inline-block;
      width: 28px;
      height: 28px;
      border: 3px solid rgba(99, 102, 241, 0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ── Responsive ─────────────────────────────── */
    @media (max-width: 600px) {
      .header {
        padding: 16px;
      }

      .gallery {
        padding: 16px;
        gap: 14px;
      }

      .search-box {
        width: 100%;
      }

      .gallery {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      }
    }
  </style>
</head>

<body>

  <!-- Header -->
  <header class="header">
    <div>
      <h1>🍽️ Menu Image Gallery</h1>
      <span class="count" id="countLabel">Loading…</span>
    </div>
    <div class="search-box">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8" />
        <path d="m21 21-4.3-4.3" />
      </svg>
      <input type="text" id="searchInput" placeholder="Search images…" autocomplete="off" />
    </div>
  </header>

  <!-- Gallery Grid -->
  <section class="gallery" id="gallery">
    <div class="loading" id="loadingEl">
      <div class="spinner"></div>
      <div>Loading images…</div>
    </div>
    <div class="no-results" id="noResults">No images match your search.</div>
  </section>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    const gallery = document.getElementById('gallery');
    const noResults = document.getElementById('noResults');
    const loadingEl = document.getElementById('loadingEl');
    const toast = document.getElementById('toast');
    const countEl = document.getElementById('countLabel');
    const searchIn = document.getElementById('searchInput');

    let images = [];

    // ── Load images.json dynamically ──────────────
    async function loadImages() {
      try {
        const resp = await fetch('./images.json?t=' + Date.now());
        images = await resp.json();
      } catch (e) {
        // Fallback: if fetch fails (file:// protocol), show error
        loadingEl.innerHTML = '⚠️ Could not load <b>images.json</b>. Run <code>scan-images.ps1</code> first, then open this page via a local server.';
        console.error('Failed to load images.json:', e);
        return;
      }
      loadingEl.style.display = 'none';
      buildCards();
    }

    // ── Build cards ───────────────────────────────
    function buildCards(filter = '') {
      gallery.querySelectorAll('.card').forEach(c => c.remove());

      const q = filter.toLowerCase();
      let visible = 0;

      images.forEach(name => {
        if (q && !name.toLowerCase().includes(q)) return;
        visible++;

        const card = document.createElement('div');
        card.className = 'card';
        card.title = 'Click to copy image URL';

        const encodedName = encodeURIComponent(name);
        const imgSrc = `./${encodedName}`;
        const displayName = name.replace(/\.[^/.]+$/, '');

        card.innerHTML = `
          <div class="img-wrap">
            <img src="${imgSrc}" alt="${displayName}" loading="lazy" />
          </div>
          <div class="overlay">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            <span>Click to copy URL</span>
          </div>
          <div class="label">${displayName}</div>
        `;

        card.addEventListener('click', () => copyUrl(name, imgSrc));
        gallery.appendChild(card);
      });

      noResults.style.display = visible === 0 ? 'block' : 'none';
      countEl.textContent = `${visible} image${visible !== 1 ? 's' : ''}`;
    }

    // ── Copy URL ──────────────────────────────────
    function copyUrl(name, relativeSrc) {
      const absUrl = new URL(relativeSrc, window.location.href).href;

      navigator.clipboard.writeText(absUrl).then(() => {
        showToast(`✅ Copied: ${absUrl}`);
      }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = absUrl;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast(`✅ Copied: ${absUrl}`);
      });
    }

    // ── Toast ─────────────────────────────────────

    let toastTimer;
    function showToast(msg) {
      clearTimeout(toastTimer);
      toast.textContent = msg;
      toast.classList.add('show');
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // ── Search ────────────────────────────────────
    searchIn.addEventListener('input', () => buildCards(searchIn.value));

    // ── Init ──────────────────────────────────────
    loadImages();
  </script>
</body>

</html>
